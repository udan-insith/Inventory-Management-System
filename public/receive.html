<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gift Storage — Receive</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/style.css" />
		<link rel="stylesheet" href="/css/print.css" />
	</head>
	<body data-page="receive" data-txn-type="receive">
		<div class="app-shell">
			<div id="sidebar-root"></div>

			<main class="main">
				<div class="page-header">
					<div>
						<h1>Receive Gifts</h1>
						<div class="page-sub">
							Bring new stock into the storage — covers as many items as you
							need.
						</div>
					</div>
				</div>

				<div class="letter-card receive-theme" id="letter-card">
					<div>
						<div class="letter-status-title">Receive letter</div>
						<div class="letter-status-sub" id="letter-sub">Checking…</div>
					</div>
					<div class="letter-actions">
						<button
							class="btn btn-outline btn-sm"
							id="upload-letter-btn"
							style="display: none"
						>
							Upload
						</button>
					</div>
				</div>

				<form id="txn-form">
					<div class="txn-page-layout">
						<div class="card">
							<div class="section-title">Details</div>
							<div class="form-error" id="txn-error"></div>
							<div class="field">
								<label for="txn-branch">Branch Name</label>
								<select id="txn-branch" required>
									<option value="">Select a branch…</option>
								</select>
							</div>
							<div class="field">
								<label for="txn-date">Date</label>
								<input type="date" id="txn-date" required />
							</div>
							<div class="field mt-0">
								<label for="txn-event">Event Name</label>
								<input
									type="text"
									id="txn-event"
									placeholder="e.g. Branch Anniversary"
									required
								/>
							</div>
						</div>

						<div class="card">
							<div class="flex-between" style="margin-bottom: 10px">
								<div class="section-title" style="margin-bottom: 0">Items</div>
								<button
									type="button"
									class="btn btn-outline btn-sm"
									id="txn-add-item-btn"
								>
									+ Add Item
								</button>
							</div>
							<div class="txn-items-list" id="txn-items-list">
								<div class="txn-items-empty">No items added yet.</div>
							</div>
						</div>
					</div>

					<div class="modal-actions" style="max-width: 460px; margin-top: 20px">
						<button type="button" class="btn btn-outline" id="txn-print-btn">
							Print
						</button>
						<button type="submit" class="btn btn-primary" id="txn-submit-btn">
							Receive
						</button>
					</div>
				</form>
			</main>
		</div>

		<!-- ===================== Add-item-to-transaction sub-modal ===================== -->
		<div class="modal-backdrop" id="txn-item-modal" aria-hidden="true">
			<div class="modal-panel">
				<div class="modal-header">
					<h2>Add item</h2>
					<button class="modal-close" data-modal-close aria-label="Close">
						&times;
					</button>
				</div>
				<div class="form-error" id="txn-item-error"></div>
				<form id="txn-item-form">
					<div class="field">
						<label for="txn-item-select">Item Name</label>
						<select id="txn-item-select" required>
							<option value="">Select an item…</option>
						</select>
					</div>
					<div class="field">
						<label for="txn-item-amount">Amount</label>
						<input
							type="number"
							id="txn-item-amount"
							min="1"
							step="1"
							placeholder="0"
							required
						/>
					</div>
					<div class="modal-actions">
						<button type="button" class="btn btn-outline" data-modal-close>
							Cancel
						</button>
						<button type="submit" class="btn btn-primary" id="txn-item-submit">
							Add
						</button>
					</div>
				</form>
			</div>
		</div>
	</body>
</html>
