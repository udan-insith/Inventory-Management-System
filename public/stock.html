<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gift Storage — Stock</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/style.css" />
		<link rel="stylesheet" href="/css/print.css" />
	</head>
	<body data-page="stock">
		<div class="app-shell">
			<div id="sidebar-root"></div>

			<main class="main">
				<div class="page-header">
					<div>
						<h1>Stock</h1>
						<div class="page-sub">
							Every item in the storage. Issue and Receive have their own pages
							now.
						</div>
					</div>
					<button class="btn btn-primary" id="add-item-btn">
						+ Add New Item
					</button>
				</div>

				<div class="search-row">
					<input
						type="text"
						id="item-search"
						placeholder="Search items by name…"
					/>
				</div>

				<div id="item-grid" class="item-grid"></div>
			</main>
		</div>
		<!-- ===================== Add New Item modal ===================== -->
		<div class="modal-backdrop" id="add-item-modal" aria-hidden="true">
			<div class="modal-panel">
				<div class="modal-header">
					<h2>Add a new item</h2>
					<button class="modal-close" data-modal-close aria-label="Close">
						&times;
					</button>
				</div>
				<div class="modal-sub">
					If it already has stock on the shelf, enter that as its current
					balance. A photo is optional.
				</div>
				<div class="form-error" id="add-item-error"></div>
				<form id="add-item-form">
					<div class="field">
						<label for="new-item-name">Item name</label>
						<input
							type="text"
							id="new-item-name"
							placeholder="e.g. Desk Clocks"
							required
						/>
					</div>
					<div class="field">
						<label for="new-item-balance">Current balance</label>
						<input
							type="number"
							id="new-item-balance"
							min="0"
							step="1"
							value="0"
							required
						/>
					</div>
					<div class="field">
						<label for="new-item-low-stock">Low-stock warning below</label>
						<input
							type="number"
							id="new-item-low-stock"
							min="0"
							step="1"
							value="5"
							required
						/>
					</div>
					<div class="field">
						<label for="new-item-image">Photo (optional)</label>
						<input type="file" id="new-item-image" accept="image/*" />
					</div>
					<div class="modal-actions">
						<button type="button" class="btn btn-outline" data-modal-close>
							Cancel
						</button>
						<button type="submit" class="btn btn-primary" id="add-item-submit">
							Add Item
						</button>
					</div>
				</form>
			</div>
		</div>

		<!-- ===================== Change Photo modal ===================== -->
		<div class="modal-backdrop" id="change-photo-modal" aria-hidden="true">
			<div class="modal-panel">
				<div class="modal-header">
					<h2>Change photo</h2>
					<button class="modal-close" data-modal-close aria-label="Close">
						&times;
					</button>
				</div>
				<div class="form-error" id="change-photo-error"></div>
				<form id="change-photo-form">
					<div class="field">
						<label for="change-photo-file">New photo</label>
						<input
							type="file"
							id="change-photo-file"
							accept="image/*"
							required
						/>
					</div>
					<div class="modal-actions">
						<button type="button" class="btn btn-outline" data-modal-close>
							Cancel
						</button>
						<button
							type="submit"
							class="btn btn-primary"
							id="change-photo-submit"
						>
							Save Photo
						</button>
					</div>
				</form>
			</div>
		</div>

		<!-- ===================== View Log modal ===================== -->
		<div class="modal-backdrop" id="log-modal" aria-hidden="true">
			<div class="modal-panel wide">
				<div class="modal-header">
					<h2 id="log-modal-title">Item Log</h2>
					<button class="modal-close" data-modal-close aria-label="Close">
						&times;
					</button>
				</div>
				<div
					class="flex-between"
					style="margin-bottom: 14px; flex-wrap: wrap; gap: 10px"
				>
					<div class="filter-group" style="margin: 0">
						<label>From</label>
						<input type="date" id="log-date-from" style="min-width: 130px" />
					</div>
					<div class="filter-group" style="margin: 0">
						<label>To</label>
						<input type="date" id="log-date-to" style="min-width: 130px" />
					</div>
					<button
						type="button"
						class="btn btn-ghost btn-sm"
						id="log-clear-filter-btn"
					>
						Clear
					</button>
					<div style="flex: 1"></div>
					<button
						type="button"
						class="btn btn-outline btn-sm"
						id="log-print-btn"
					>
						Print (PDF)
					</button>
				</div>
				<div
					class="log-wrap"
					id="log-modal-body"
					style="max-height: 50vh"
				></div>
			</div>
		</div>

		<div class="print-area print-only" id="print-area"></div>

		<script src="/js/api.js"></script>
		<script src="/js/toast.js"></script>
		<script src="/js/animate.js"></script>
		<script src="/js/modal.js"></script>
		<script src="/js/sortable-log.js"></script>
		<script src="/js/nav.js"></script>
		<script src="/js/stock.js"></script>
	</body>
</html>
