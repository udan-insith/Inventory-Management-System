<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gift Storage — Stock</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/style.css" />
		<link rel="stylesheet" href="/css/print.css" />
	</head>
	<body data-page="stock">
		<div class="app-shell">
			<div id="sidebar-root"></div>

			<main class="main">
				<div class="page-header">
					<div>
						<h1>Stock</h1>
						<div class="page-sub">
							Every item in the storage. Issue and Receive have their own pages
							now.
						</div>
					</div>
					<button class="btn btn-primary" id="add-item-btn">
						+ Add New Item
					</button>
				</div>

				<div class="search-row">
					<input
						type="text"
						id="item-search"
						placeholder="Search items by name…"
					/>
				</div>

				<div id="item-grid" class="item-grid"></div>
			</main>
		</div>
	</body>
</html>
